services:
  - type: web
    name: lockin-api
    runtime: java
    rootDir: server
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/lockin-server-0.0.1-SNAPSHOT.jar
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lockin-db
          property: connectionString
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: lockin-web
          property: host

  - type: web
    name: lockin-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lockin-api
          property: host

databases:
  - name: lockin-db
    databaseName: lockin_db
    user: lockin_user
    plan: free
