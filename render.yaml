services:
  - type: web
    name: lockin-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false # Paste your direct Neon Postgres URL in Render dashboard
      - key: DATABASE_URL_POOLED
        sync: false # Paste your pooled (-pooler) Neon Postgres URL in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_AUTO_VERIFY
        value: "true"
      - key: ADMIN_EMAILS
        value: "azon1129@gmail.com,admin@lockin.app"
      - key: GEMINI_API_KEY
        sync: false # Optional: add a Gemini API key for custom AI goal plans
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: lockin-web
          property: host

  - type: web
    name: lockin-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lockin-api
          property: host
